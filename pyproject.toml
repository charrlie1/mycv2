[build-system]
requires = ["setuptools>=61.0","wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "mycv"
version = "4.2.1"
description = "Pure-NumPy computer vision library built from mathematical first principles"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.9"
authors = [{name = "Abodunrin Charles Toluwanimi", email = "charrlie1@users.noreply.github.com"}]
keywords = ["computer-vision","image-processing","numpy","tracking","detection","calibration","kalman-filter"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Education",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Topic :: Scientific/Engineering :: Image Processing",
]
dependencies = ["numpy>=1.22.0"]

[project.optional-dependencies]
demo    = ["pygame-ce>=2.1.0","av>=11.0.0","pillow>=9.0.0"]
dev     = ["pytest>=7.4.0","pytest-cov>=4.1.0","black>=23.0.0","ruff>=0.1.0"]
notebook= ["jupyter>=1.0.0","matplotlib>=3.5.0","pillow>=9.0.0"]

[project.urls]
Homepage      = "https://github.com/charrlie1/mycv2"
Repository    = "https://github.com/charrlie1/mycv2.git"

[tool.setuptools.packages.find]
include = ["mycv*"]

[tool.setuptools.package-data]
mycv = ["models/*.npz", "models/*.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts   = "-v --tb=short"
filterwarnings = ["ignore::DeprecationWarning"]

[tool.black]
line-length = 95
target-version = ["py39","py310","py311","py312"]
